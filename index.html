<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>Prendas para o Antonio</title>
<meta name="description" content="A lista de prendas do Antonio." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #ffffff;
    --ink: #1a1a1a;
    --ink-soft: #8a8a8a;
    --tile: #f3f3f3;
    --tile-line: #ededed;
    --accent: #ff3b5c;
    --pill: #f2f2f2;
    --pill-hover: #e8e8e8;
    --radius: 18px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    color: var(--ink);
    background: var(--bg);
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; text-decoration: none; }

  /* ---- Top bar ---- */
  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 24px;
    border-bottom: 1px solid var(--tile-line);
    position: sticky; top: 0; background: rgba(255,255,255,.9);
    backdrop-filter: saturate(180%) blur(8px); z-index: 10;
  }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 1.15rem; }
  .brand .mark {
    width: 30px; height: 30px; border-radius: 9px; background: var(--accent);
    display: grid; place-items: center; color: #fff; font-size: 16px;
  }
  .topbar .share-top {
    border: none; background: var(--pill); color: var(--ink);
    font-family: inherit; font-weight: 600; font-size: .92rem;
    padding: 9px 18px; border-radius: 999px; cursor: pointer;
    transition: background .15s ease;
  }
  .topbar .share-top:hover { background: var(--pill-hover); }

  /* ---- Header ---- */
  header.hero { text-align: center; padding: 48px 20px 14px; }
  .hero .eyebrow { color: var(--ink-soft); font-size: .95rem; font-weight: 500; margin: 0 0 6px; }
  .hero h1 {
    font-weight: 800; font-size: clamp(2.2rem, 7vw, 3.4rem);
    margin: 0 0 18px; letter-spacing: -1.5px; line-height: 1.05;
  }
  .hero .share {
    border: none; background: var(--pill); color: var(--ink);
    font-family: inherit; font-weight: 600; font-size: .95rem;
    padding: 10px 26px; border-radius: 999px; cursor: pointer;
    transition: background .15s ease, transform .1s ease;
  }
  .hero .share:hover { background: var(--pill-hover); }
  .hero .share:active { transform: scale(.97); }

  /* ---- Toolbar ---- */
  .toolbar {
    max-width: 1180px; margin: 28px auto 10px; padding: 0 20px;
    display: flex; justify-content: flex-end; color: var(--ink-soft); font-size: .9rem;
  }
  .toolbar b { color: var(--ink); font-weight: 600; margin-left: 6px; }

  /* ---- Masonry grid ---- */
  main { max-width: 1180px; margin: 0 auto; padding: 8px 14px 90px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 28px 20px; align-items: start; }
  @media (max-width: 520px) { .grid { grid-template-columns: repeat(2, 1fr); gap: 18px 12px; } }

  .item { display: block; cursor: pointer; }
  .item .imgtile {
    background: var(--tile); border-radius: var(--radius); overflow: hidden;
    aspect-ratio: 1 / 1; display: flex; align-items: center; justify-content: center;
    transition: transform .18s ease, box-shadow .18s ease;
  }
  .item .imgtile img { width: 100%; height: 100%; object-fit: contain; padding: 12px; display: block; }
  .item .imgtile.ph {
    aspect-ratio: 1/1; display: grid; place-items: center; line-height: 1;
  }
  .item .imgtile.ph span { font-size: 44px; opacity: .4; }
  .item:hover .imgtile { transform: translateY(-3px); box-shadow: 0 12px 28px rgba(0,0,0,.10); }
  .item:hover .title { color: var(--accent); }
  .item .meta { transition: transform .18s ease; }
  .item:hover .meta { transform: translateY(-3px); }

  .item .meta { padding: 10px 4px 0; }
  .item .title { font-size: .95rem; font-weight: 500; line-height: 1.35; margin: 0 0 6px; }
  .item .price-row { display: flex; align-items: center; gap: 7px; }
  .item .price-row img.fav { width: 16px; height: 16px; border-radius: 4px; flex: none; }
  .item .price { font-size: .92rem; font-weight: 700; }
  .item .note { color: var(--ink-soft); font-size: .85rem; margin: 5px 0 0; }

  .item .reserve {
    margin-top: 10px; width: 100%; border: 1px solid var(--tile-line);
    background: var(--card); color: var(--ink); font-family: inherit;
    font-weight: 600; font-size: .85rem; padding: 8px 10px; border-radius: 999px;
    cursor: pointer; transition: background .15s ease, border-color .15s ease;
  }
  .item .reserve:hover { background: var(--pill); }
  .item .badge {
    display: none; margin-top: 8px; font-size: .78rem; font-weight: 700;
    color: #2e7d32; background: #e7f6e9; padding: 3px 9px; border-radius: 999px;
    width: fit-content;
  }
  .item.reserved .imgtile { opacity: .5; filter: grayscale(.4); }
  .item.reserved .title { color: var(--ink-soft); text-decoration: line-through; }
  .item.reserved .price-row { opacity: .6; }
  .item.reserved .badge { display: inline-block; }
  .item.reserved .reserve { background: var(--pill); color: var(--ink-soft); }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .item .badge { color: #a5e0ad; background: #1f3322; }
  }

  .state { text-align: center; padding: 70px 20px; color: var(--ink-soft); font-size: 1.05rem; }
  .state .emoji { font-size: 40px; display: block; margin-bottom: 12px; }

  .toast {
    position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%) translateY(20px);
    background: var(--ink); color: #fff; padding: 11px 20px; border-radius: 999px;
    font-size: .9rem; font-weight: 600; opacity: 0; pointer-events: none;
    transition: opacity .2s ease, transform .2s ease; z-index: 50;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #141414; --ink: #f3f3f3; --ink-soft: #9a9a9a;
      --tile: #242424; --tile-line: #2c2c2c; --pill: #262626; --pill-hover: #333;
    }
  }
</style>
</head>
<body>
  <nav class="topbar">
    <div class="brand"><span class="mark">♥</span> Prendas para o António</div>
    <button class="share-top" onclick="sharePage()">Partilhar</button>
  </nav>

  <header class="hero">
    <p class="eyebrow" id="eyebrow">Para eu sempre adorar</p>
    <h1>A minha wishlist</h1>
    <button class="share" onclick="sharePage()">Partilhar lista</button>
  </header>

  <div class="toolbar">Ordenar por: <b>Preço</b></div>

  <main>
    <div id="state" class="state"><span class="emoji">🎀</span>A carregar…</div>
    <div id="grid" class="grid" hidden></div>
  </main>

  <div id="toast" class="toast">Link copiado ✓</div>

<script>
  const SHEET_ID = "12Fo9ZaevmDxr5uzhAy0UGL2nLAoYMubpwA9esuPZEvw";
  const SHEET_NAME = "Sheet1";
  const CSV_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(SHEET_NAME)}`;

  // Google Apps Script Web App URL that writes reservations back to the Sheet.
  // Paste the /exec URL from your deployment here (leave "" to disable reserving).
  const RESERVE_URL = "https://script.google.com/macros/s/AKfycbxEhfFfjQq7acBsnxBewpxW0jmJVo_N71d5l0UvSooJ4_Pzf9VyFX9302QFuX1SYF5wuQ/exec";

  // Offline fallback (used only if the live Sheet fetch is blocked, e.g. in a preview sandbox).
  const FALLBACK_ITEMS = [
    { name: "Xanthan Gum em pó 500g — Food Bites", image_url: "https://m.media-amazon.com/images/I/31kvyJyeEUL.jpg", amazon_url: "https://www.amazon.es/dp/B0CKTS13ND", price: "€17,77", note: "Para cozinha molecular e mixologia" },
    { name: "Chef Pomodoro Pá para Pizza 30x35cm", image_url: "https://m.media-amazon.com/images/I/31G22hqeavL.jpg", amazon_url: "https://www.amazon.es/dp/B01NBX7GOB", price: "€21,23", note: "Alumínio · promo Black Friday" },
    { name: "Faber-Castell Pitt Pastel — 60 lápis", image_url: "https://m.media-amazon.com/images/I/41kyHQAjImL.jpg", amazon_url: "https://www.amazon.es/dp/B000LY5AF0", price: "€115,30", note: "Caixa de metal, cores pastel" },
    { name: "Victoria Frigideira Ferro Fundido 30cm", image_url: "https://m.media-amazon.com/images/I/31-wXbMPAxL.jpg", amazon_url: "https://www.amazon.es/dp/B01726HD72", price: "€48,47", note: "Curada, sem PTFE/PFOA" },
    { name: "Matsato Faca de Chef 16cm", image_url: "https://m.media-amazon.com/images/I/41jXfb854ML.jpg", amazon_url: "https://www.amazon.es/dp/B0FN84958F", price: "€34,55", note: "Cabo de faia, full-tang" },
    { name: "Chef Pomodoro Pizza Steel 41x34cm", image_url: "https://m.media-amazon.com/images/I/61EindUmjfL.jpg", amazon_url: "https://www.amazon.es/dp/B0C2D47D9Z", price: "€55,90", note: "Aço carbono · preciso de 2" },
    { name: "Sondiko Maçarico de Cozinha recarregável", image_url: "https://m.media-amazon.com/images/I/31MYr6itu2L.jpg", amazon_url: "https://www.amazon.es/dp/B08Y5M5V3X", price: "€18,29", note: "Preto/branco · gás não incluído" },
    { name: "Kitchenatics Grelha de arrefecimento/forno", image_url: "https://m.media-amazon.com/images/I/51WB5FT1zSL.jpg", amazon_url: "https://www.amazon.es/dp/B01DOJIFTQ", price: "€41,28", note: "Inox, 25x38cm" },
    { name: "Bosch UniversalTemp Termómetro infravermelho", image_url: "https://m.media-amazon.com/images/I/41oPdzn6H8L.jpg", amazon_url: "https://www.amazon.es/dp/B0CFVZQFZ5", price: "€52,85", note: "-30 a +500°C" },
    { name: "Tramontina Tacho inox Grain 3,5L", image_url: "https://m.media-amazon.com/images/I/21SzVnZMSBL.jpg", amazon_url: "https://www.amazon.es/dp/B088MFRKLX", price: "€57,16", note: "Promo Black Friday" },
    { name: "Tramontina Tacho Tri-Ply Grain 20cm 3,1L", image_url: "https://m.media-amazon.com/images/I/21672vv+g1L.jpg", amazon_url: "https://www.amazon.es/dp/B098WY3MP5", price: "€73,43", note: "Tri-Ply com tampa" },
  ];

  function parseCSV(text) {
    const rows = []; let row = [], field = "", q = false;
    for (let i = 0; i < text.length; i++) {
      const c = text[i];
      if (q) {
        if (c === '"') { if (text[i+1] === '"') { field += '"'; i++; } else q = false; }
        else field += c;
      } else {
        if (c === '"') q = true;
        else if (c === ',') { row.push(field); field = ""; }
        else if (c === '\n') { row.push(field); rows.push(row); row = []; field = ""; }
        else if (c === '\r') {}
        else field += c;
      }
    }
    if (field.length || row.length) { row.push(field); rows.push(row); }
    return rows;
  }
  function el(t, c, h) { const n = document.createElement(t); if (c) n.className = c; if (h != null) n.innerHTML = h; return n; }
  function esc(s) { return (s||"").replace(/[&<>"']/g, m => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[m])); }
  function isHttp(u) { return /^https?:\/\//i.test((u||"").trim()); }
  function domain(u) { try { return new URL(u).hostname; } catch { return ""; } }
  // Parse a price string to a number for sorting. Non-priced items sort last.
  function parsePrice(p) {
    if (!p) return Infinity;
    const m = String(p).match(/[\d.,]+/);
    if (!m) return Infinity;
    let s = m[0];
    if (s.includes(",") && s.includes(".")) {
      if (s.lastIndexOf(",") > s.lastIndexOf(".")) s = s.replace(/\./g, "").replace(",", ".");
      else s = s.replace(/,/g, "");
    } else if (s.includes(",")) {
      s = s.replace(",", ".");
    }
    const n = parseFloat(s);
    return isNaN(n) ? Infinity : n;
  }

  function sharePage() {
    const url = location.href;
    if (navigator.share) { navigator.share({ title: "Prendas para o Antonio", url }).catch(()=>{}); return; }
    navigator.clipboard?.writeText(url).then(showToast).catch(()=>{});
  }
  let toastT;
  function showToast(msg) {
    const t = document.getElementById("toast");
    if (msg) t.textContent = msg;
    t.classList.add("show"); clearTimeout(toastT);
    toastT = setTimeout(() => t.classList.remove("show"), 2000);
  }

  // ---- Reservations ----
  function paintReserve(it, item, badge, rbtn) {
    const who = (it.reserved || "").trim();
    if (who) {
      item.classList.add("reserved");
      badge.textContent = "🎁 Reservado";
      rbtn.textContent = "Cancelar reserva";
    } else {
      item.classList.remove("reserved");
      badge.textContent = "";
      rbtn.textContent = "Reservar 🎁";
    }
  }

  function toggleReserve(it, item, badge, rbtn) {
    if (!RESERVE_URL) { alert("As reservas ainda não estão ativas."); return; }
    const who = (it.reserved || "").trim();
    let value;
    if (who) {
      if (!confirm(`"${it.name}" está reservado. Cancelar a reserva?`)) return;
      value = "";
    } else {
      value = "sim";
    }
    it.reserved = value;
    paintReserve(it, item, badge, rbtn); // optimistic
    postReserve(it, value);
    showToast(value ? "Reservado ✓" : "Reserva cancelada");
  }

  function postReserve(it, value) {
    try {
      fetch(RESERVE_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({ url: (it.amazon_url||"").trim(), title: (it.name||"").trim(), reserved: value }),
      }).catch(() => {});
    } catch (e) { console.error(e); }
  }

  function render(items) {
    const grid = document.getElementById("grid"), state = document.getElementById("state");
    grid.innerHTML = "";
    items = [...items].sort((a, b) => parsePrice(a.price) - parsePrice(b.price));
    const cheapest = items.find(it => isFinite(parsePrice(it.price)));
    const eb = document.getElementById("eyebrow");
    if (eb && cheapest) eb.textContent = "Prendas desde " + String(cheapest.price).trim();
    if (!items.length) {
      state.innerHTML = '<span class="emoji">🫙</span>A lista ainda está vazia.';
      state.hidden = false; grid.hidden = true; return;
    }
    for (const it of items) {
      const hasLink = isHttp(it.amazon_url);
      const item = el(hasLink ? "a" : "div", "item");
      if (hasLink) { item.href = it.amazon_url.trim(); item.target = "_blank"; item.rel = "noopener noreferrer"; }

      if (isHttp(it.image_url)) {
        const tile = el("div", "imgtile");
        const img = document.createElement("img");
        img.loading = "lazy"; img.alt = it.name || "prenda"; img.src = it.image_url.trim();
        img.onerror = () => { tile.className = "imgtile ph"; tile.innerHTML = '<span>🎁</span>'; };
        tile.appendChild(img); item.appendChild(tile);
      } else {
        item.appendChild(el("div", "imgtile ph", '<span>🎁</span>'));
      }

      const meta = el("div", "meta");
      meta.appendChild(el("p", "title", esc(it.name || "Prenda")));
      if (it.price && it.price.trim()) {
        const pr = el("div", "price-row");
        if (hasLink) {
          const fav = document.createElement("img");
          fav.className = "fav"; fav.alt = "";
          fav.src = `https://www.google.com/s2/favicons?sz=32&domain=${domain(it.amazon_url)}`;
          fav.onerror = () => fav.remove();
          pr.appendChild(fav);
        }
        pr.appendChild(el("span", "price", esc(it.price)));
        meta.appendChild(pr);
      }
      if (it.note && it.note.trim()) meta.appendChild(el("p", "note", esc(it.note)));

      // Reservation: badge + button
      const badge = el("span", "badge", "");
      meta.appendChild(badge);
      const rbtn = el("button", "reserve", "");
      rbtn.type = "button";
      rbtn.addEventListener("click", (e) => { e.preventDefault(); e.stopPropagation(); toggleReserve(it, item, badge, rbtn); });
      meta.appendChild(rbtn);
      paintReserve(it, item, badge, rbtn);

      item.appendChild(meta);
      grid.appendChild(item);
    }
    state.hidden = true; grid.hidden = false;
  }

  async function load() {
    const state = document.getElementById("state");
    try {
      const res = await fetch(CSV_URL, { cache: "no-store" });
      if (!res.ok) throw new Error("HTTP " + res.status);
      const rows = parseCSV(await res.text()).filter(r => r.some(c => (c||"").trim() !== ""));
      if (!rows.length) { render([]); return; }
      const header = rows[0].map(h => h.trim().toLowerCase());
      const col = n => header.indexOf(n);
      const iN = col("name"), iI = col("image_url"), iA = col("amazon_url"), iP = col("price"), iNote = col("note"), iR = col("reserved");
      const items = rows.slice(1).map(r => ({
        name: iN>=0 ? r[iN] : r[0],
        image_url: iI>=0 ? r[iI] : "",
        amazon_url: iA>=0 ? r[iA] : "",
        price: iP>=0 ? r[iP] : "",
        note: iNote>=0 ? r[iNote] : "",
        reserved: iR>=0 ? r[iR] : "",
      })).filter(it => (it.name||"").trim() !== "");
      render(items);
    } catch (e) {
      console.error(e);
      // Live fetch blocked (e.g. preview sandbox) — show the baked-in list so the design is visible.
      render(FALLBACK_ITEMS);
    }
  }
  load();
</script>
</body>
</html>
